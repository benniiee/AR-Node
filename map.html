<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0c">
    <title>ARNode</title>
    <!-- Installable app (PWA): manifest, icons and iPhone home-screen settings. Files live in public/. -->
    <!-- use-credentials: sends cookies with the manifest request. Without them, ngrok's free plan
         answers it with its "You are about to visit" page and the app cannot be installed. -->
    <link rel="manifest" href="/map-manifest.json" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/pwa/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/pwa/favicon-16x16.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ARNode">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; overscroll-behavior: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/mobile.jsx"></script>
</body>
</html>
